name: Daily pipeline (scrape + deploy)

# Runs the full scrape -> inject -> wash -> fill pipeline on a schedule, refreshes
# index.html, and publishes to GitHub Pages. Replaces the manual run on a laptop.
#
# Requires repo secret GMAIL_APP_PASSWORD (Settings -> Secrets and variables ->
# Actions). Trigger manually any time via the "Run workflow" button.

on:
  schedule:
    # 19:17 UTC daily = 05:17 AEST (UTC+10) / 06:17 AEDT (UTC+11, ~Oct-Apr).
    # Proping emails arrive ~04:45 local, so this runs after them. Not on the
    # hour on purpose: GitHub queues top-of-the-hour schedules heavily, and a
    # 05:00 start was observed beginning 2h16m late (Sep 2026). With Scrapfly
    # fetching in parallel the run takes ~15-20 min, so data should be live
    # well before staff start. Late Proping emails are picked up by catchup.yml.
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed index.html
  pages: write      # publish to GitHub Pages
  id-token: write   # Pages deploy auth

concurrency:
  group: pages      # shared with deploy.yml so Pages deploys never overlap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Free-tier Supabase auto-pauses after 7 days of DB inactivity. The daily
      # pipeline only writes to git, not Supabase, so this lightweight ping
      # keeps the project's activity counter ticking. The publishable key is
      # the same one already shipped in mm-supabase.js (intentionally public).
      # Note: we don't use `-f`; any HTTP response still counts as activity,
      # so don't fail the whole pipeline if Supabase is briefly degraded.
      - name: Heartbeat Supabase (prevent free-tier pause)
        run: |
          curl -s -o /dev/null -w "Supabase ping: HTTP %{http_code}\n" \
            -H "apikey: sb_publishable_aJddeid2D0-0kDWclrNRgQ_nt_kQih5" \
            https://phkmwcimpyvmxbpdmuvw.supabase.co/auth/v1/health

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # Cache pip downloads keyed off requirements.txt hash — saves
          # 1-2 min per run vs reinstalling from PyPI every time.
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      # Cache the Playwright chromium binary (~150 MB). The --with-deps
      # apt install still runs each time (system libs), but the download
      # is skipped on cache hit, saving 3-5 min per run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          python -m playwright install --with-deps chromium
          # Patchright ships its own patched chromium build for stealth.
          # `|| true` because failure is non-fatal — the Domain scraper
          # falls back to vanilla playwright if patchright isn't usable.
          python -m patchright install chromium || true
          # For patchright's full-stealth mode we launch real Google Chrome
          # (not Chromium). GH ubuntu-latest already ships Chrome; the
          # install is a no-op if present. Verify it's callable.
          which google-chrome || sudo apt-get install -y google-chrome-stable
          google-chrome --version || true

      # Interim state continuity (scraper caches / first-seen). Becomes
      # unnecessary once the data lives in Supabase. Rolling cache: unique save
      # key + prefix restore-key always restores the most recent.
      - name: Restore pipeline state
        uses: actions/cache@v4
        with:
          path: |
            pipeline/*.json
            pipeline/scripts/*.json
          key: pipeline-state-${{ github.run_id }}
          restore-keys: |
            pipeline-state-

      # The master HTML is gitignored, so it isn't in the checkout. The deployed
      # index.html IS the latest master (it's a copy), so seed from it.
      - name: Seed master HTML from deployed index.html
        run: cp index.html pipeline/mazar_martin_app.html

      - name: Run pipeline (scrape -> inject -> wash -> fill)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Domain sits behind Akamai and blocks 100% of requests from
          # Actions runners. Scrapfly's ASP proxy is the only path that
          # works; without this secret the scraper falls back to the local
          # browser and returns zero listings (photos still come from the
          # Proping emails, but baths/car/type/land go unfilled).
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
          # Domain pages fetched at once through Scrapfly (was sequential,
          # ~45 min). Lower it if Scrapfly starts returning 429s.
          SCRAPFLY_CONCURRENCY: '4'
          PYTHONUTF8: '1'
          # Runner is UTC; scrape_gmail.py uses dt.astimezone() (the system local zone)
          # to stamp each email's date, so without this a 4:34 AM AEST email lands as
          # the previous UTC day — that's why the dashboard "today" pills showed zeros.
          TZ: Australia/Sydney
        run: python pipeline/scripts/run_pipeline.py --no-deploy

      # Checks what the run actually produced (Proping details parsing,
      # Scrapfly pages/credits, scrapers refreshing, off-market emails
      # arriving, For Sale freshness) and emails a plain-English alert when a
      # source breaks or goes quiet, plus a fortnightly all-clear summary.
      # Never blocks the deploy.
      - name: Data health check
        if: always()
        continue-on-error: true
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HEALTH_ALERT_TO: david@tavoautomation.com
          PYTHONUTF8: '1'
          TZ: Australia/Sydney
        run: python pipeline/scripts/health_check.py

      - name: Copy refreshed master to index.html
        run: cp pipeline/mazar_martin_app.html index.html

      - name: Commit refreshed index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change to index.html — skipping commit"
          else
            git commit -m "Daily update $(date -u '+%d %b %Y %H:%M') UTC"
            # A code push during the run would otherwise reject this push and
            # silently skip the day's deploy. The data update only touches the
            # data blocks of index.html, so rebasing onto new code is safe.
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
